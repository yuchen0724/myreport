version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: report_postgres
    environment:
      POSTGRES_DB: report_db
      POSTGRES_USER: report_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-report_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_user -d report_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - report_network

  redis:
    image: redis:7-alpine
    container_name: report_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - report_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: report_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://report_user:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/report_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - PASSWORD_ENCRYPTION_KEY=${PASSWORD_ENCRYPTION_KEY:?Set PASSWORD_ENCRYPTION_KEY}
      - LLM_API_KEY=${LLM_API_KEY:?Set LLM_API_KEY}
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - report_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: report_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - report_network
    restart: unless-stopped

networks:
  report_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
